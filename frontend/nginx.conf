server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Clean URL handling for top-level routes and /pages/
    location / {
        try_files $uri $uri.html $uri/ /pages$uri.html /index.html =404;
    }

    # Product details dynamic URL support
    location ~* ^/product/ {
        try_files /pages/product-details.html =404;
    }

    # Static assets caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
